<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>sous-chef</title>
<link rel="manifest" href="/static/manifest.json">
<link rel="apple-touch-icon" href="/static/icons/icon-180.png">
<link rel="icon" type="image/png" href="/static/icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="sous-chef">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#fbf8f4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121110" media="(prefers-color-scheme: dark)">
<meta name="format-detection" content="telephone=no">
<style>
:root{
  --bg:#fbf8f4; --card:#ffffff; --ink:#1c1a17; --muted:#6f6a63; --line:#ebe5dc;
  --accent:#c2410c; --on-accent:#ffffff; --accent-soft:#fdeee5;
  --good:#15803d; --warn:#b45309; --bad:#b91c1c; --info:#6d28d9; --away:#78716c;
  --radius:14px; --tabbar:62px;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#121110; --card:#1c1a18; --ink:#ede9e3; --muted:#a39d94; --line:#2c2925;
        --accent:#fb8a4c; --on-accent:#1c1006; --accent-soft:#3a2216;
        --good:#4ade80; --warn:#fbbf24; --bad:#f87171; --info:#c4b5fd; --away:#a8a29e;}
}
*{box-sizing:border-box}
/* Flex and grid items default to min-width:auto, which lets a long title push
   a card wider than the phone. Every container below opts out. */
main>*,.card,.row>*,.cardrow>*,.days>*,.meta>*,.line>*{min-width:0}
html{overflow-x:clip;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  -webkit-font-smoothing:antialiased}
header{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px);
  border-bottom:1px solid var(--line);
  padding:calc(.6rem + env(safe-area-inset-top)) max(1rem,env(safe-area-inset-right)) .6rem max(1rem,env(safe-area-inset-left));
  display:flex;align-items:center;gap:.6rem}
header h1{font-size:1.05rem;margin:0;font-weight:700;letter-spacing:-.01em}
header h1 span{color:var(--accent)}
header .sub{margin-left:auto;color:var(--muted);font-size:.8rem;text-align:right;overflow-wrap:anywhere}
main{max-width:760px;margin:0 auto;display:grid;gap:.85rem;
  padding:.85rem max(1rem,env(safe-area-inset-right)) calc(var(--tabbar) + 1.2rem + env(safe-area-inset-bottom)) max(1rem,env(safe-area-inset-left))}
section[hidden]{display:none!important}
.view{display:grid;gap:.85rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:.95rem}
.card h2{margin:0 0 .6rem;font-size:.74rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700;
  display:flex;align-items:center;gap:.5rem}
.card h2 .right{margin-left:auto;text-transform:none;letter-spacing:0;font-weight:500}
h3{margin:0;font-size:1rem;font-weight:650;line-height:1.3;overflow-wrap:anywhere}
p{margin:.4rem 0}
.muted{color:var(--muted)}
.small{font-size:.82rem}
.tiny{font-size:.74rem}
.err{color:var(--bad);overflow-wrap:anywhere;font-size:.88rem}
.row{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap}
.spacer{flex:1}
button,.btn{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);
  padding:.5rem .8rem;border-radius:10px;cursor:pointer;text-decoration:none;display:inline-flex;
  align-items:center;gap:.35rem;line-height:1.2;-webkit-tap-highlight-color:transparent}
button:hover,.btn:hover{border-color:var(--accent)}
button:disabled{opacity:.5;cursor:default}
.primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent);font-weight:600}
.ghost{background:transparent;border-color:transparent;color:var(--muted);padding:.4rem .5rem}
.ghost:hover{color:var(--ink);border-color:transparent}
.chip{border-radius:999px;padding:.35rem .75rem;font-size:.85rem}
.chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
.pill{display:inline-block;padding:.08rem .5rem;border-radius:999px;font-size:.72rem;font-weight:600;
  background:color-mix(in srgb,var(--muted) 14%,transparent);color:var(--muted);white-space:nowrap}
.pill.good{background:color-mix(in srgb,var(--good) 15%,transparent);color:var(--good)}
.pill.warn{background:color-mix(in srgb,var(--warn) 15%,transparent);color:var(--warn)}
.pill.bad{background:color-mix(in srgb,var(--bad) 13%,transparent);color:var(--bad)}
.pill.info{background:color-mix(in srgb,var(--info) 14%,transparent);color:var(--info)}
.pill.accent{background:var(--accent-soft);color:var(--accent)}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.stepper button{border:0;border-radius:0;padding:.4rem .7rem;font-size:1.05rem;line-height:1}
.stepper span{min-width:2.2rem;text-align:center;font-weight:650;font-variant-numeric:tabular-nums}
input,select,textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);
  border-radius:10px;padding:.55rem .7rem;max-width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px}
textarea{width:100%;resize:vertical;min-height:7rem;line-height:1.4}
label.field{display:grid;gap:.25rem;font-size:.82rem;color:var(--muted)}
label.field input,label.field select,label.field textarea{color:var(--ink)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(150px,100%),1fr));gap:.65rem}
.num{font-variant-numeric:tabular-nums}
.big{font-size:1.55rem;font-weight:720;letter-spacing:-.02em;line-height:1.1}

/* week */
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin:.5rem 0 .2rem}
.day{border:1px solid var(--line);border-radius:10px;padding:.35rem .1rem .3rem;text-align:center;background:var(--bg);
  display:flex;flex-direction:column;align-items:center;gap:1px;cursor:pointer;position:relative}
.day .dw{font-size:.66rem;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.day .dn{font-weight:700;font-size:.98rem}
.day .st{font-size:.6rem;font-weight:700;text-transform:uppercase;letter-spacing:.03em;white-space:nowrap}
.day.home .st{color:var(--good)} .day.busy .st{color:var(--warn)}
.day.out .st{color:var(--info)} .day.away .st{color:var(--away)}
.day.cook{border-color:var(--accent);background:var(--accent-soft)}
.day .pin{position:absolute;top:2px;right:4px;font-size:.55rem;color:var(--muted)}
.agenda{margin-top:.5rem;border-top:1px solid var(--line)}
.ag{display:grid;grid-template-columns:2.6rem minmax(0,1fr);gap:.5rem;padding:.42rem 0;border-bottom:1px solid var(--line);font-size:.84rem}
.ag:last-child{border-bottom:0}
.ag .d{font-weight:700;color:var(--muted);font-size:.78rem;padding-top:.05rem}
.ag .l{overflow-wrap:anywhere}
.ag .cook{color:var(--accent);font-weight:600}
.ag .gap{color:var(--bad)}
.legend{font-size:.72rem;color:var(--muted)}

/* bars */
.bars{display:grid;gap:.45rem;margin-top:.55rem}
.bar{display:grid;grid-template-columns:4.6rem minmax(0,1fr) 5.2rem;align-items:center;gap:.5rem;font-size:.82rem}
.track{height:8px;border-radius:99px;background:color-mix(in srgb,var(--muted) 18%,transparent);position:relative;overflow:hidden}
.fill{position:absolute;inset:0 auto 0 0;border-radius:99px;background:var(--good)}
.fill.short{background:var(--warn)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.5rem}
.stat .k{font-size:.7rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.stat .v{font-size:1.2rem;font-weight:700;font-variant-numeric:tabular-nums}

/* recipe cards */
.rc{border:1px solid var(--line);border-radius:12px;padding:.75rem;display:grid;gap:.45rem;background:var(--bg)}
.rc + .rc{margin-top:.6rem}
.rc .top{display:flex;gap:.5rem;align-items:flex-start}
.rc .top h3{flex:1;cursor:pointer}
.meta{display:flex;flex-wrap:wrap;gap:.25rem .7rem;font-size:.8rem;color:var(--muted)}
.meta b{color:var(--ink);font-weight:650}
.meta b.short{color:var(--warn)}
.tags{display:flex;flex-wrap:wrap;gap:.3rem}
.cardrow{display:flex;gap:.45rem;align-items:center;flex-wrap:wrap}
.chef{border:1px dashed var(--accent);border-radius:12px;padding:.6rem .7rem;margin-bottom:.7rem;font-size:.84rem;background:var(--accent-soft)}
.chef .ln{display:flex;gap:.4rem;align-items:baseline;overflow-wrap:anywhere}
.chef .ln.done{color:var(--good);font-weight:600}
.chef .ln.bad{color:var(--bad)}
.dots{display:inline-flex;gap:3px;margin-left:.2rem}
.dots i{width:5px;height:5px;border-radius:50%;background:var(--accent);animation:blip 1.2s ease-in-out infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes blip{0%,60%,100%{opacity:.25}30%{opacity:1}}
@media (prefers-reduced-motion:reduce){.dots i{animation:none;opacity:.7}}
.craft{display:flex;gap:.45rem;margin-top:.7rem}
.craft input{flex:1;min-width:0}
.empty{color:var(--muted);font-size:.88rem;padding:.4rem 0}

/* shopping */
.store h3{font-size:1rem;display:flex;align-items:baseline;gap:.5rem}
.store h3 .num{margin-left:auto}
.aisle{font-size:.7rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:.8rem 0 .15rem;font-weight:700}
.item{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:.6rem;align-items:start;padding:.5rem 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item input[type=checkbox]{width:1.3rem;height:1.3rem;margin:.1rem 0 0;accent-color:var(--accent)}
.item .nm{font-weight:600;overflow-wrap:anywhere}
.item.checked .nm{text-decoration:line-through;color:var(--muted)}
.item .sub2{font-size:.78rem;color:var(--muted);overflow-wrap:anywhere}
.item .pr{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.item .pr .tiny{display:block;font-weight:400;color:var(--muted)}

/* pantry & prices */
.ing{border-bottom:1px solid var(--line);padding:.5rem 0}
.ing:last-child{border-bottom:0}
.ing .hd{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:.6rem;align-items:center}
.ing .hd .nm{font-weight:600;overflow-wrap:anywhere;cursor:pointer}
.switch{display:inline-flex;align-items:center;gap:.35rem;font-size:.78rem;color:var(--muted);white-space:nowrap}
.switch input{width:1.15rem;height:1.15rem;accent-color:var(--accent)}
.offers{display:grid;gap:.5rem;margin-top:.5rem}
.offer{display:grid;grid-template-columns:3.4rem minmax(0,1fr);gap:.5rem;align-items:center;font-size:.82rem}
.offer .fields{display:flex;gap:.35rem;flex-wrap:wrap;align-items:center}
.offer input:not([type=checkbox]){padding:.35rem .45rem;width:5.2rem}
.offer input.q{width:4.2rem}
.offer select{padding:.35rem .4rem}
.src{font-size:.68rem}

/* recipe sheet */
.sheet{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.42);display:flex;align-items:flex-end;justify-content:center}
.sheet[hidden]{display:none}
.sheet .panel{background:var(--card);width:min(760px,100%);max-height:94vh;overflow-y:auto;border-radius:18px 18px 0 0;
  padding:1rem max(1rem,env(safe-area-inset-right)) calc(1.2rem + env(safe-area-inset-bottom)) max(1rem,env(safe-area-inset-left));
  -webkit-overflow-scrolling:touch}
@media (min-width:700px){.sheet{align-items:center}.sheet .panel{border-radius:18px;max-height:88vh}}
.sheet .close{float:right;margin:-.2rem -.2rem 0 .5rem}
.sheet h2{margin:.1rem 0 .3rem;font-size:1.25rem;line-height:1.25;overflow-wrap:anywhere}
.lines{list-style:none;padding:0;margin:.4rem 0}
.lines li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:.6rem;padding:.38rem 0;border-bottom:1px solid var(--line);font-size:.9rem}
.lines li:last-child{border-bottom:0}
.lines .amt{font-weight:650}
.lines .c{color:var(--muted);font-variant-numeric:tabular-nums;font-size:.82rem}
.steps{padding-left:1.25rem;margin:.4rem 0}
.steps li{margin:.45rem 0}
.nut{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:.3rem;text-align:center;margin:.6rem 0}
.nut div{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:.35rem .1rem}
.nut b{display:block;font-size:1rem;font-variant-numeric:tabular-nums}
.nut span{font-size:.64rem;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}

/* tab bar */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--card) 92%,transparent);
  backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px);
  border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,minmax(0,1fr));
  padding:0 env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
nav.tabs button{border:0;border-radius:0;background:transparent;flex-direction:column;gap:2px;padding:.45rem 0 .5rem;
  height:var(--tabbar);font-size:.68rem;color:var(--muted);justify-content:center}
nav.tabs button svg{width:23px;height:23px}
nav.tabs button.on{color:var(--accent);font-weight:650}
#offline{display:none;padding:.5rem 1rem;background:var(--bad);color:#fff;font-size:.82rem}
#offline.on{display:block}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tabbar) + 14px + env(safe-area-inset-bottom));
  background:var(--ink);color:var(--bg);padding:.55rem .9rem;border-radius:12px;font-size:.85rem;z-index:40;
  max-width:calc(100% - 2rem);opacity:0;transition:opacity .15s ease;pointer-events:none}
#toast.on{opacity:1}
@media (max-width:420px){
  .card{padding:.8rem}
  .stats .v{font-size:1.05rem}
}
</style>
</head>
<body>
<header>
  <h1>sous<span>·</span>chef</h1>
  <div class="sub" id="hdr-sub"></div>
</header>
<div id="offline">Can't reach your Mac — it may be asleep. Nothing live until it's back.</div>
<main>
  <!-- ── Plan ─────────────────────────────────────── -->
  <section class="view" id="v-plan">
    <div class="card" id="week-card"><div class="empty">Loading…</div></div>
    <div class="card" id="summary-card" hidden></div>
    <div class="card" id="chosen-card"></div>
    <div class="card" id="cands-card"></div>
  </section>

  <!-- ── Shop ─────────────────────────────────────── -->
  <section class="view" id="v-shop" hidden>
    <div id="shop"></div>
  </section>

  <!-- ── Recipes ──────────────────────────────────── -->
  <section class="view" id="v-recipes" hidden>
    <div class="card">
      <h2>Your recipes<span class="right"><button class="ghost small" data-action="import-open">Import a recipe</button></span></h2>
      <input id="rq" type="search" placeholder="Search recipes" style="width:100%">
      <div class="row" id="rcuis" style="margin-top:.55rem"></div>
      <div id="rlist" style="margin-top:.7rem"></div>
    </div>
  </section>

  <!-- ── Pantry & prices ──────────────────────────── -->
  <section class="view" id="v-pantry" hidden>
    <div class="card">
      <h2>Pantry &amp; prices</h2>
      <p class="small muted">Tick what you already have — it stays off the shopping list. Tap an item to
        correct a price or package size; prices you enter are marked <span class="pill good">yours</span>,
        the rest are estimates (<span class="pill">est.</span>).</p>
      <div class="row">
        <input id="pq" type="search" placeholder="Search ingredients" style="flex:1;min-width:0">
        <select id="pfilter" aria-label="Filter">
          <option value="">All</option><option value="pantry">In pantry</option>
          <option value="est">Estimated prices</option><option value="mine">My prices</option>
        </select>
      </div>
      <div id="plist" style="margin-top:.6rem"></div>
    </div>
  </section>

  <!-- ── Settings ─────────────────────────────────── -->
  <section class="view" id="v-settings" hidden>
    <form class="card" id="prefs-form" autocomplete="off"></form>
  </section>
</main>

<div class="sheet" id="sheet" hidden><div class="panel" id="sheet-body"></div></div>
<div id="toast"></div>

<nav class="tabs" aria-label="Sections">
  <button data-tab="plan" class="on" aria-label="Plan">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 9.5h17M8 3v4M16 3v4"/></svg>Plan</button>
  <button data-tab="shop" aria-label="Shopping list">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4h2.2l2.1 11h10.4l2-8H6.3"/><circle cx="9.5" cy="19" r="1.4"/><circle cx="16.5" cy="19" r="1.4"/></svg>Shop</button>
  <button data-tab="recipes" aria-label="Recipes">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4.5h10.5A3.5 3.5 0 0 1 19 8v11.5H8.5A3.5 3.5 0 0 1 5 16z"/><path d="M5 16a3.5 3.5 0 0 1 3.5-3.5H19M9 8h6"/></svg>Recipes</button>
  <button data-tab="pantry" aria-label="Pantry and prices">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3.5h8M9 3.5v3L6.5 9.5V19a1.5 1.5 0 0 0 1.5 1.5h8A1.5 1.5 0 0 0 17.5 19V9.5L15 6.5v-3"/><path d="M6.5 13h11"/></svg>Pantry</button>
  <button data-tab="settings" aria-label="Settings">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>Settings</button>
</nav>

<script>
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money = n => '$' + Number(n || 0).toFixed(2);
const g = n => Math.round(Number(n || 0));
const short = name => String(name).split(',')[0].replace(/\s*\(.*\)$/, '');
const DOWS = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const STATUS_LABEL = {home:'Free', busy:'Busy', out:'Out', away:'Away'};
const STATUS_CYCLE = [null, 'home', 'busy', 'out', 'away'];
const ORIGIN = {library:'', claude:'✨ Claude', craft:'✨ Crafted', import:'Imported'};

const S = {plan:null, prefs:null, tab:'plan', grocery:null, recipes:null, catalog:null,
           chef:{busy:false, lines:[], saved:new Set()}, open:{}, sheet:null, cuisine:''};

// ── plumbing ───────────────────────────────────────────────
async function api(method, path, body){
  let res;
  try{
    res = await fetch(path, {method, headers: body ? {'Content-Type':'application/json'} : {},
                             body: body ? JSON.stringify(body) : undefined});
  }catch(e){ setOffline(true); throw new Error('offline'); }
  if(res.status === 503){
    const j = await res.json().catch(() => ({}));
    if(j.offline){ setOffline(true); throw new Error('offline'); }
  }
  setOffline(false);
  if(!res.ok){
    const j = await res.json().catch(() => ({detail: res.statusText}));
    const err = new Error(typeof j.detail === 'string' ? j.detail : JSON.stringify(j.detail));
    err.status = res.status;
    throw err;
  }
  return res.json();
}
function setOffline(on){ $('#offline').classList.toggle('on', on); }
let toastTimer;
function toast(msg){
  const t = $('#toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('on'), 2600);
}
function fail(e){ if(e.message !== 'offline') toast(e.message); }
function fmtDate(iso, opts = {month:'short', day:'numeric'}){
  const [y, m, d] = iso.split('-').map(Number);
  return new Date(y, m - 1, d).toLocaleDateString(undefined, opts);
}
function addDays(iso, n){
  const [y, m, d] = iso.split('-').map(Number);
  const dt = new Date(y, m - 1, d + n);
  return `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`;
}
function to12(hhmm){
  const [h, m] = hhmm.split(':').map(Number);
  return `${((h + 11) % 12) + 1}:${String(m).padStart(2,'0')}${h < 12 ? 'am' : 'pm'}`;
}

// ── tabs ───────────────────────────────────────────────────
function showTab(tab){
  S.tab = tab;
  $$('nav.tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === tab));
  $$('main > section').forEach(s => s.hidden = s.id !== 'v-' + tab);
  try{ localStorage.setItem('sc-tab', tab); }catch(e){}
  window.scrollTo(0, 0);
  if(tab === 'plan') renderPlan();

  if(tab === 'pantry') loadCatalog();
  if(tab === 'settings') renderSettings();
}

// ── chef ───────────────────────────────────────────────────
// A run lives on the Mac, not in this page. If the stream drops — the phone
// locked, Safari went to the background — the run carries on, so the page
// reconnects to it and keeps its buttons disabled. Giving up instead let a
// second tap start a second run on the same week, and the two saved copies
// of each other's recipes.
function chefPush(text, cls){
  S.chef.lines.push({text, cls}); S.chef.lines = S.chef.lines.slice(-6); renderCands(S.plan);
}
let chefRefreshTimer = null;
function chefRefresh(){
  clearTimeout(chefRefreshTimer);
  chefRefreshTimer = setTimeout(async () => {
    try{ S.plan = await api('GET', `/api/plan/${S.plan.id}`); renderPlan(); }catch(e){}
  }, 250);
}

// Read one chef stream. Resolves 'done', 'idle', or 'dropped' (ended early).
async function followChef(res){
  if(!res.ok || !res.body) return 'dropped';
  const reader = res.body.getReader(), dec = new TextDecoder();
  let buf = '';
  for(;;){
    let chunk;
    try{ chunk = await reader.read(); }catch(e){ return 'dropped'; }
    if(chunk.done) return 'dropped';
    buf += dec.decode(chunk.value, {stream:true});
    let i;
    while((i = buf.indexOf('\n\n')) >= 0){
      const block = buf.slice(0, i); buf = buf.slice(i + 2);
      if(!block.startsWith('data: ')) continue;          // keepalive comments
      const ev = JSON.parse(block.slice(6));
      if(ev.type === 'idle') return 'idle';
      if(ev.type === 'attached'){
        // A replay from the start follows, so start the lines over.
        const asked = S.chef.asked;
        S.chef = {busy:true, lines:[], saved:new Set(), asked};
        if(asked && asked !== 'reconnect') chefPush('Still finishing the last request — joined it rather than starting another.');
        else renderCands(S.plan);
      }
      else if(ev.type === 'status') chefPush(esc(ev.text));
      else if(ev.type === 'recipe'){ S.chef.saved.add(ev.id); chefPush('✓ ' + esc(ev.title), 'done'); chefRefresh(); }
      else if(ev.type === 'retry') chefPush('Fixing: ' + esc(ev.text));
      else if(ev.type === 'text') chefPush('<span class="muted">' + esc(ev.text) + '</span>');
      else if(ev.type === 'error') chefPush(esc(ev.text), 'bad');
      else if(ev.type === 'done') return 'done';
    }
  }
}

async function runChef(body){
  if(S.chef.busy) return;
  S.chef = {busy:true, lines:[], saved:new Set(), asked: body.task};
  renderCands(S.plan);
  $('#chef-anchor')?.scrollIntoView({behavior:'smooth', block:'center'});
  let outcome = 'dropped';
  try{
    const res = await fetch('/api/chef', {method:'POST', headers:{'Content-Type':'application/json'},
                                          body: JSON.stringify({plan_id: S.plan.id, ...body})});
    outcome = await followChef(res);
  }catch(e){ /* never reached the Mac, or dropped at once */ }
  if(outcome === 'dropped') return reconnectChef();
  endChef();
}

// Wait `ms`, but never while the page is hidden: a locked phone does nothing.
function pause(ms){
  return new Promise(resolve => {
    const finish = () => { clearTimeout(t); document.removeEventListener('visibilitychange', onVis); resolve(); };
    const onVis = () => { if(document.visibilityState === 'visible') finish(); };
    const t = setTimeout(() => { if(document.visibilityState === 'visible') finish(); }, ms);
    document.addEventListener('visibilitychange', onVis);
  });
}

async function reconnectChef(){
  chefPush('Lost the connection — your Mac is still working on it. Reconnecting…');
  S.chef.asked = 'reconnect';
  for(let attempt = 0; attempt < 40; attempt++){
    try{
      const res = await fetch(`/api/chef/stream?plan_id=${S.plan.id}&recent=1`);
      const outcome = await followChef(res);
      if(outcome === 'done' || outcome === 'idle') return endChef();
    }catch(e){}
    await pause(3000);
  }
  chefPush("Couldn't reconnect. Anything the chef saved will appear once your Mac is reachable.", 'bad');
  endChef();
}

// On opening the app: if a run is going on the Mac, show it and follow it.
async function resumeChef(){
  if(S.chef.busy || !S.plan) return;
  let res;
  try{ res = await fetch(`/api/chef/stream?plan_id=${S.plan.id}`); }catch(e){ return; }
  S.chef.asked = 'reconnect';
  const outcome = await followChef(res);
  if(outcome === 'idle') return;
  if(outcome === 'dropped') return reconnectChef();
  endChef();
}

async function endChef(){
  const saved = S.chef.saved ? S.chef.saved.size : 0;
  S.chef.busy = false;
  if(saved) S.chef.lines = S.chef.lines.filter(l => l.cls === 'done' || l.cls === 'bad');
  try{ S.plan = await api('GET', `/api/plan/${S.plan.id}`); }catch(e){}
  renderPlan();
  if(S.tab === 'recipes') loadRecipes();
}

// ── shop ───────────────────────────────────────────────────
// Ticks made with no connection wait here and are sent on the next good load.
function pendingChecks(){ try{ return JSON.parse(localStorage.getItem('sc-pending') || '{}'); }catch(e){ return {}; } }
function savePending(p){ try{ localStorage.setItem('sc-pending', JSON.stringify(p)); }catch(e){} }
async function flushChecks(){
  const pending = pendingChecks();
  for(const [key, checked] of Object.entries(pending)){
    const [plan, id] = key.split('|');
    await api('POST', `/api/plan/${plan}/grocery/check`, {ingredient_id: id, checked});
    delete pending[key]; savePending(pending);
  }
}
async function loadShop(){
  if(!S.plan) return;
  try{
    await flushChecks();
    S.grocery = await api('GET', `/api/plan/${S.plan.id}/grocery`);
    S.groceryStale = false;
    try{ localStorage.setItem('sc-grocery', JSON.stringify({plan: S.plan.id, list: S.grocery})); }catch(e){}
  }catch(e){
    // In a store with no signal, the last list is far better than nothing.
    let saved = null;
    try{ saved = JSON.parse(localStorage.getItem('sc-grocery') || 'null'); }catch(_){}
    if(!saved || saved.plan !== S.plan.id) return fail(e);
    S.grocery = saved.list; S.groceryStale = true;
  }
  renderShop();
}

      <div class="small muted">${s.count} item${s.count === 1 ? '' : 's'}</div>

            <span class="sub2" style="display:block">${esc(it.uses.map(u => u.recipe).filter((v, i, a) => a.indexOf(v) === i).join(' · '))}</span></span>
          <span class="pr">${money(it.cost)}${it.price_source !== 'user' ? '<span class="tiny">est.</span>' : ''}</span>
        </label>`).join('')).join('')}
    </div>`).join('');
  const left = gl.leftovers.length ? `
    <div class="card"><h2>Left over after this week</h2>
      <p class="small" style="margin-top:0">${gl.leftovers.map(x => `${esc(short(x.name).toLowerCase())} (~${Math.round(x.fraction * 100)}% of the package)`).join(' · ')}</p>
      <button data-action="use-up">✨ Ask Claude for a recipe that uses these</button></div>` : '';
  const pantry = gl.pantry.length ? `
    <div class="card"><h2>From your pantry</h2><p class="small muted" style="margin:0">${gl.pantry.map(p => esc(p.name)).join(' · ')}</p></div>` : '';
  const missing = gl.unavailable.length ? `
    <div class="card"><h2>Not at your stores</h2>${gl.unavailable.map(u => `<div class="small"><b>${esc(u.name)}</b> — ${esc(u.need)}${u.elsewhere.length ? ` · available at ${esc(u.elsewhere.join(', '))}` : ''}</div>`).join('')}</div>` : '';
  el.innerHTML = `
    ${S.groceryStale ? '<div class="card small" style="border-color:var(--warn)">Showing the last copy saved on this phone — ticks will sync when your Mac is reachable again.</div>' : ''}
    <div class="card">
      <h2>Shopping list<span class="right small">${fmtDate(S.plan.week_start)}</span></h2>
      <div class="big num">${money(gl.total)}</div>
      <p class="small muted" style="margin:.3rem 0 0">${gl.stock_up_value >= 1 ? `About ${money(gl.stock_up_value)} of that is staples you'll have plenty left of — spices, sauces, rice. ` : ''}Food actually used this week: ${money(gl.used_total)}.${gl.estimated ? ' Prices are estimates until you correct them.' : ''}</p>
      <div class="row" style="margin-top:.7rem">
        <a class="btn primary" href="/api/plan/${S.plan.id}/calendar.ics">📅 Add cook times to calendar</a>
        ${gl.stock_up.length ? `<button data-action="stock">Done shopping: move staples to pantry</button>` : ''}
      </div>
    </div>
    ${missing}${stores}${left}${pantry}`;
}

// ── recipes ────────────────────────────────────────────────
async function loadRecipes(){
  const q = $('#rq').value.trim();
  const qs = new URLSearchParams({q}); if(S.cuisine) qs.set('cuisine', S.cuisine);
  try{ S.recipes = await api('GET', `/api/recipes?${qs}`); }catch(e){ return fail(e); }
  const names = S.prefs?.cuisine_names || {};
  $('#rcuis').innerHTML = [['', 'All'], ...Object.entries(names)].map(([k, v]) =>
    `<button class="chip ${S.cuisine === k ? 'on' : ''}" data-action="cuisine" data-c="${k}">${esc(v)}</button>`).join('');
  $('#rlist').innerHTML = S.recipes.length ? S.recipes.map(r => `
    <div class="rc"><div class="top"><h3 data-action="view" data-id="${r.id}">${esc(r.title)}</h3></div>
      ${recipeMeta(r)}${recipeTags(r)}</div>`).join('') : '<div class="empty">No recipes match.</div>';
}

// ── pantry & prices ────────────────────────────────────────
async function loadCatalog(){
  try{ S.catalog = await api('GET', '/api/catalog'); }catch(e){ return fail(e); }
  renderCatalog();
}
function renderCatalog(){
  const q = $('#pq').value.trim().toLowerCase(), f = $('#pfilter').value;
  const units = ['each','lb','oz','g','kg','can','jar','carton','bunch','head','pint','block','link','pouch','fl oz','l','ml','cup'];
  let items = S.catalog || [];
  if(q) items = items.filter(i => q.split(/\s+/).every(w => (i.name + ' ' + i.aisle).toLowerCase().includes(w)));
  if(f === 'pantry') items = items.filter(i => i.pantry);
  if(f === 'est') items = items.filter(i => i.offers.some(o => o.source !== 'user'));
  if(f === 'mine') items = items.filter(i => i.offers.some(o => o.source === 'user'));
  let lastAisle = '';
  $('#plist').innerHTML = items.map(i => {
    const head = i.aisle !== lastAisle ? `<div class="aisle">${esc(i.aisle)}</div>` : '';
    lastAisle = i.aisle;
    const open = S.open['ing-' + i.id];
    const tj = i.offers.find(o => o.store === (S.prefs?.stores?.[0] || 'tj')) || i.offers[0];
    return head + `<div class="ing">
      <div class="hd"><span class="nm" data-action="ing" data-id="${i.id}">${esc(i.name)}
          <span class="tiny muted" style="font-weight:400">${tj ? '· ' + money(tj.price) + ' ' + esc(tj.store_name) : ''} ${open ? '▴' : '▾'}</span></span>
        <label class="switch"><input type="checkbox" data-action="pantry" data-id="${i.id}" ${i.pantry ? 'checked' : ''}> have it</label></div>
      ${open ? `<div class="offers">${['tj','qfc','pcc'].map(s => {
          const o = i.offers.find(x => x.store === s);
          const name = S.plan?.store_names?.[s] || s;
          if(!o) return `<div class="offer"><b>${esc(name)}</b><span class="muted small">not in the catalog
              <button class="ghost small" data-action="add-offer" data-id="${i.id}" data-store="${s}">add a price</button></span></div>`;
          return `<div class="offer"><b>${esc(name)}</b><div class="fields">
            $<input inputmode="decimal" value="${o.price}" data-action="price" data-id="${i.id}" data-store="${s}" aria-label="${esc(name)} price" ${o.carried ? '' : 'disabled'}>
            for <input class="q" inputmode="decimal" value="${o.pkg_qty}" data-action="pkgq" data-id="${i.id}" data-store="${s}" aria-label="package size" ${o.carried ? '' : 'disabled'}>
            <select data-action="pkgu" data-id="${i.id}" data-store="${s}" aria-label="package unit" ${o.carried ? '' : 'disabled'}>${[...new Set([o.pkg_unit, ...units.filter(u => i.units.includes(u))])].map(u => `<option ${u === o.pkg_unit ? 'selected' : ''}>${esc(u)}</option>`).join('')}</select>
            <span class="pill src ${o.source === 'user' ? 'good' : ''}">${o.source === 'user' ? 'yours' : o.source === 'claude' ? 'Claude est.' : 'est.'}</span>
            <label class="switch"><input type="checkbox" data-action="carried" data-id="${i.id}" data-store="${s}" ${o.carried ? 'checked' : ''}> carried</label>
            <span class="tiny muted" style="flex-basis:100%">${esc(o.product)}</span></div></div>`;
        }).join('')}
        <div class="tiny muted">Per 100 g: ${g(i.per_100g.kcal)} kcal · ${i.per_100g.protein} g protein · ${i.per_100g.fiber} g fiber</div></div>` : ''}
    </div>`;
  }).join('') || '<div class="empty">Nothing matches.</div>';
}
async function savePrice(id, store){
  const row = (sel) => $(`[data-action="${sel}"][data-id="${id}"][data-store="${store}"]`);
  const price = parseFloat(row('price').value), qty = parseFloat(row('pkgq').value), unit = row('pkgu').value;
  if(!(price > 0) || !(qty > 0)) return toast('Price and package size must be positive numbers');
  try{
    const ing = await api('PUT', '/api/price', {ingredient_id:id, store, price, pkg_qty:qty, pkg_unit:unit});
    S.catalog = S.catalog.map(i => i.id === id ? {...i, ...ing} : i);
    renderCatalog(); toast('Saved — this is now your price'); S.grocery = null;
    refreshPlanQuietly();
  }catch(e){ fail(e); }
}
async function refreshPlanQuietly(){ try{ S.plan = await api('GET', `/api/plan/${S.plan.id}`); }catch(e){} }

// ── settings ───────────────────────────────────────────────
function renderSettings(){
  const p = S.prefs; if(!p) return;
  const cuis = Object.entries(p.cuisine_names).filter(([k]) => k !== 'other');
  const order = [...p.stores, ...Object.keys(p.store_names).filter(s => !p.stores.includes(s))];
  $('#prefs-form').innerHTML = `
    <h2>Settings</h2>
    <div class="grid2">
      <label class="field">People eating<input type="number" min="1" max="12" name="household" value="${p.household}"></label>
      <label class="field">Default servings per recipe<input type="number" min="1" max="24" name="default_servings" value="${p.default_servings}"></label>
      <label class="field">Recipes per week<input type="number" min="1" max="14" name="n_recipes" value="${p.n_recipes}"></label>
      <label class="field">Lunches from leftovers (weekdays)<input type="number" min="0" max="5" name="lunches" value="${p.lunches}"></label>
      <label class="field">Dinner time<input type="time" name="dinner_time" value="${p.dinner_time}"></label>
      <label class="field">Weeknight time limit (min)<input type="number" min="10" max="240" name="max_weeknight_min" value="${p.max_weeknight_min}"></label>
      <label class="field">Leftovers keep (days)<input type="number" min="1" max="7" name="leftover_days" value="${p.leftover_days}"></label>
    </div>
    <h2 style="margin-top:1.1rem">Targets per serving</h2>
    <div class="grid2">
      <label class="field">Protein (g)<input type="number" min="0" max="150" name="protein_g" value="${p.protein_g}"></label>
      <label class="field">Fiber (g)<input type="number" min="0" max="60" name="fiber_g" value="${p.fiber_g}"></label>
      <label class="field">Calories<input type="number" min="200" max="2000" name="kcal" value="${p.kcal}"></label>
    </div>
    <h2 style="margin-top:1.1rem">Cuisines</h2>
    <div class="grid2">${cuis.map(([k, v]) => `<label class="field">${esc(v)}
      <select name="cuisine:${k}">${[0,1,2,3].map(n => `<option value="${n}" ${(p.cuisines[k] ?? 1) === n ? 'selected' : ''}>${['Never','Sometimes','Often','Most'][n]}</option>`).join('')}</select></label>`).join('')}</div>
    <h2 style="margin-top:1.1rem">Stores</h2>
    <p class="small muted" style="margin-top:0">Ticked stores in priority order: each item comes from the first one that carries it.</p>
    <div id="store-order">${order.map((s, i) => `<div class="row" style="padding:.25rem 0">
      <label class="switch" style="color:var(--ink);font-size:.95rem"><input type="checkbox" name="store:${s}" ${p.stores.includes(s) ? 'checked' : ''}> ${esc(p.store_names[s])}</label>
      <span class="spacer"></span>
      <button type="button" class="ghost" data-action="store-up" data-store="${s}" ${i === 0 ? 'disabled' : ''} aria-label="Move up">↑</button></div>`).join('')}</div>
    <h2 style="margin-top:1.1rem">For the chef</h2>
    <label class="field">Avoid (allergies, dislikes — comma separated)<input name="avoid" value="${esc(p.avoid.join(', '))}" placeholder="e.g. cilantro, shellfish"></label>
    <label class="field" style="margin-top:.6rem">Equipment<input name="equipment" value="${esc(p.equipment.join(', '))}"></label>
    <label class="field" style="margin-top:.6rem">Anything else<textarea name="notes" style="min-height:4rem" placeholder="e.g. I like spicy food; batch-friendly on Sundays">${esc(p.notes)}</textarea></label>
    <h2 style="margin-top:1.1rem">Calendar</h2>
    <p class="small muted" style="margin-top:0">Paste private calendar feed links, one per line, to mark busy evenings and dinners out automatically.
      <b>Google:</b> calendar.google.com → Settings → your calendar → <i>Secret address in iCal format</i>.
      <b>iCloud:</b> Calendar app → share the calendar → <i>Public Calendar</i> → copy link (webcal://…).
      Cook times go the other way with the 📅 button on the Shop tab.</p>
    <label class="field">Feeds<textarea name="calendar_feeds" style="min-height:4.5rem" placeholder="https://calendar.google.com/calendar/ical/…/basic.ics">${esc(p.calendar_feeds.join('\n'))}</textarea></label>
    <label class="field" style="margin-top:.6rem">Time zone<input name="timezone" value="${esc(p.timezone)}"></label>
    <div class="row" style="margin-top:1rem"><span class="spacer"></span><button class="primary" type="submit">Save settings</button></div>`;
}
async function saveSettings(ev){
  ev.preventDefault();
  const f = new FormData($('#prefs-form')), p = S.prefs;
  const order = $$('#store-order input[type=checkbox]').map(i => i.name.slice(6));
  const changes = {
    household: +f.get('household'), default_servings: +f.get('default_servings'), n_recipes: +f.get('n_recipes'),
    lunches: +f.get('lunches'), dinner_time: f.get('dinner_time'), max_weeknight_min: +f.get('max_weeknight_min'),
    leftover_days: +f.get('leftover_days'), protein_g: +f.get('protein_g'), fiber_g: +f.get('fiber_g'), kcal: +f.get('kcal'),
    cuisines: Object.fromEntries(Object.keys(p.cuisine_names).filter(k => k !== 'other').map(k => [k, +f.get('cuisine:' + k)])),
    stores: order.filter(s => f.get('store:' + s)),
    avoid: String(f.get('avoid')).split(',').map(s => s.trim()).filter(Boolean),
    equipment: String(f.get('equipment')).split(',').map(s => s.trim()).filter(Boolean),
    notes: f.get('notes'), calendar_feeds: String(f.get('calendar_feeds')).split('\n').map(s => s.trim()).filter(Boolean),
    timezone: f.get('timezone'),
  };
  try{
    S.prefs = await api('PUT', '/api/prefs', changes);
    toast('Settings saved');
    renderSettings();
    S.plan = await api('GET', `/api/plan/${S.plan.id}`);
  }catch(e){ fail(e); }
}

// ── actions ────────────────────────────────────────────────
async function act(a, el){
  const p = S.plan, id = +el.dataset.id || el.dataset.id;
  try{
    switch(a){
      case 'shift': return setPlan(await api('PATCH', `/api/plan/${p.id}`, {week_start: addDays(p.week_start, +el.dataset.n)}));
      case 'store': {
        const s = el.dataset.store, order = [...(S.prefs.stores || []), 'tj', 'qfc', 'pcc'];
        let stores = p.stores.includes(s) ? p.stores.filter(x => x !== s) : [...p.stores, s];
        if(!stores.length) return toast('Keep at least one store');
        stores = [...new Set(order)].filter(x => stores.includes(x));
        return setPlan(await api('PATCH', `/api/plan/${p.id}`, {stores}));
      }
      case 'n': return setPlan(await api('PATCH', `/api/plan/${p.id}`, {n_recipes: Math.max(1, Math.min(14, p.n_recipes + +el.dataset.d))}));
      case 'day': {
        const d = p.week.days.find(x => x.date === el.dataset.date);
        const cur = d.overridden ? d.status : null;
        let next = STATUS_CYCLE[(STATUS_CYCLE.indexOf(cur) + 1) % STATUS_CYCLE.length];
        if(next === d.auto_status && !d.overridden) next = STATUS_CYCLE[(STATUS_CYCLE.indexOf(next) + 1) % STATUS_CYCLE.length];
        return setPlan(await api('POST', `/api/plan/${p.id}/day`, {date: d.date, status: next}));
      }
      case 'select': {
        const plan = await api('POST', `/api/plan/${p.id}/select`, {recipe_id: id, servings: el.dataset.servings ? +el.dataset.servings : null});
        closeSheet(); setPlan(plan); return toast('Added to the week');
      }
      case 'deselect': closeSheet(); return setPlan(await api('POST', `/api/plan/${p.id}/deselect`, {recipe_id: id}));
      case 'dismiss': return setPlan(await api('POST', `/api/plan/${p.id}/dismiss`, {recipe_id: id}));
      case 'serv': {
        const r = p.selected.find(x => x.id === id);
        const n = Math.max(1, Math.min(24, r.servings + +el.dataset.d));
        return setPlan(await api('POST', `/api/plan/${p.id}/servings`, {recipe_id: id, servings: n}));
      }
      case 'view': return openRecipe(id, el.dataset.servings);
      case 'sheet-serv': {
        const r = S.sheet; const n = Math.max(1, Math.min(24, r.servings + +el.dataset.d));
        const chosen = p.selected.find(x => x.id === r.id);
        if(chosen){ S.plan = await api('POST', `/api/plan/${p.id}/servings`, {recipe_id: r.id, servings: n}); renderPlan(); }
        return openRecipe(r.id, n);
      }
      case 'keep': await api('POST', `/api/recipe/${id}/library`, {keep: true}); toast('Saved to your library'); return openRecipe(id, S.sheet?.servings);
      case 'close': return closeSheet();
      case 'library': {
        const plan = await api('POST', `/api/plan/${p.id}/library`, {count: 4, replace: true});
        setPlan(plan);
        if(plan.library_exhausted) toast('That is everything in your library that fits — try ✨ New ideas from Claude');
        return;
      }
      case 'ask': return runChef({task: 'suggest', count: 3});
      case 'craft': {
        const text = $('#craft-in').value.trim();
        if(!text) return $('#craft-in').focus();
        return runChef({task: 'craft', text});
      }
      case 'use-up': {
        showTab('plan');
        const items = S.grocery.leftovers.map(x => short(x.name).toLowerCase()).join(', ');
        return runChef({task: 'suggest', count: 1, text: `Use up what will be left over: ${items}.`});
      }
      case 'import-open': return openImport();
      case 'import-go': {
        const text = $('#import-text').value.trim();
        if(!text) return;
        closeSheet(); showTab('plan');
        return runChef({task: 'import', text});
      }
      case 'new-week': {
        const plan = await api('POST', '/api/plan', {week_start: addDays(p.week_start, 7)});
        setPlan(plan); window.scrollTo(0, 0); return toast(`New plan for the week of ${fmtDate(plan.week_start)}`);
      }
      case 'stock': {
        await api('POST', '/api/pantry/stock', {ingredient_ids: S.grocery.stock_up});
        toast('Staples moved to your pantry'); S.catalog = null; return loadShop();
      }
      case 'cuisine': S.cuisine = el.dataset.c; return loadRecipes();
      case 'ing': S.open['ing-' + el.dataset.id] = !S.open['ing-' + el.dataset.id]; return renderCatalog();
      case 'add-offer': {
        const price = parseFloat(prompt('Price at this store ($)?') || '');
        if(!(price > 0)) return;
        const ing = await api('PUT', '/api/price', {ingredient_id: el.dataset.id, store: el.dataset.store, price});
        S.catalog = S.catalog.map(i => i.id === ing.id ? {...i, ...ing} : i); return renderCatalog();
      }
      case 'store-up': {
        const rows = $$('#store-order > .row'), i = rows.findIndex(r => r.querySelector(`[data-store="${el.dataset.store}"]`));
        if(i > 0){ rows[i].parentNode.insertBefore(rows[i], rows[i - 1]); }
        $$('#store-order button').forEach((b, j) => b.disabled = j === 0);
        return;
      }
    }
  }catch(e){ fail(e); }
}

document.addEventListener('click', ev => {
  const tab = ev.target.closest('nav.tabs button');
  if(tab) return showTab(tab.dataset.tab);
  if(ev.target.id === 'sheet') return closeSheet();
  const el = ev.target.closest('[data-action]');
  if(!el || el.tagName === 'SELECT' || (el.tagName === 'INPUT' && el.type !== 'button')) return;
  ev.preventDefault();
  act(el.dataset.action, el);
});
document.addEventListener('change', async ev => {
  const el = ev.target, a = el.dataset.action;
  try{
    if(a === 'cookday') setPlan(await api('POST', `/api/plan/${S.plan.id}/cook-date`, {recipe_id: +el.dataset.id, cook_date: el.value || null}));
    if(a === 'check'){
      el.closest('.item').classList.toggle('checked', el.checked);
      const it = S.grocery.stores.flatMap(s => s.aisles.flatMap(a => a.items)).find(i => i.id === el.dataset.id);
      if(it) it.checked = el.checked;
      try{ localStorage.setItem('sc-grocery', JSON.stringify({plan: S.plan.id, list: S.grocery})); }catch(e){}
      try{ await api('POST', `/api/plan/${S.plan.id}/grocery/check`, {ingredient_id: el.dataset.id, checked: el.checked}); }
      catch(err){
        if(err.message !== 'offline') throw err;
        const pending = pendingChecks(); pending[`${S.plan.id}|${el.dataset.id}`] = el.checked; savePending(pending);
      }
    }
    if(a === 'pantry'){
      await api('POST', '/api/pantry', {ingredient_id: el.dataset.id, have: el.checked});
      S.catalog = S.catalog.map(i => i.id === el.dataset.id ? {...i, pantry: el.checked} : i);
      S.grocery = null; refreshPlanQuietly();
    }
    if(a === 'price' || a === 'pkgq' || a === 'pkgu') savePrice(el.dataset.id, el.dataset.store);
    if(a === 'carried'){
      const ing = await api('POST', '/api/carried', {ingredient_id: el.dataset.id, store: el.dataset.store, carried: el.checked});
      S.catalog = S.catalog.map(i => i.id === ing.id ? {...i, ...ing} : i); renderCatalog(); refreshPlanQuietly();
    }
    if(a === 'pfilter') renderCatalog();
  }catch(e){ fail(e); }
});
document.addEventListener('toggle', ev => { if(ev.target.dataset?.key) S.open[ev.target.dataset.key] = ev.target.open; }, true);
document.addEventListener('keydown', ev => {
  if(ev.key === 'Escape' && !$('#sheet').hidden) closeSheet();
  if(ev.key === 'Enter' && ev.target.id === 'craft-in'){ ev.preventDefault(); act('craft', ev.target); }
});
$('#prefs-form').addEventListener('submit', saveSettings);
let rqTimer; $('#rq').addEventListener('input', () => { clearTimeout(rqTimer); rqTimer = setTimeout(loadRecipes, 200); });
$('#pq').addEventListener('input', () => renderCatalog());
$('#pfilter').addEventListener('change', () => renderCatalog());

// ── boot ───────────────────────────────────────────────────
if('serviceWorker' in navigator && window.isSecureContext){
  navigator.serviceWorker.register('/static/sw.js').catch(() => {});
}
(async function boot(){
  try{
    S.prefs = await api('GET', '/api/prefs');
    await loadPlan();
    resumeChef();
    let tab = 'plan';
    try{ tab = localStorage.getItem('sc-tab') || 'plan'; }catch(e){}
    showTab(tab);
  }catch(e){
    $('#week-card').innerHTML = `<div class="err">${esc(e.message === 'offline' ? "Can't reach your Mac — it may be asleep." : e.message)}</div>`;
  }
})();
document.addEventListener('visibilitychange', async () => {
  if(document.visibilityState === 'visible' && S.plan && !S.chef.busy){
    await refreshPlanQuietly();
    if(S.tab === 'plan') renderPlan();
    if(S.tab === 'shop') loadShop();
    resumeChef();   // started from another device, or before a reload
  }
});
</script>
</body>
